name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Builds the web UI with third-party npm code. Runs without the release
  # environment so no signing secrets are reachable from this job.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web tests and build
        run: cd web && npm ci && npm test && npm run build

      # Hidden files (the tracked .gitkeep) are excluded by default; the
      # release job gets .gitkeep from its own checkout.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: web
    runs-on: ubuntu-latest
    environment: release
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webui-dist
          path: internal/webui/dist

      - name: Go tests
        run: go test ./...

      # Signing secrets are all-or-none: a partial set would publish binaries that
      # are signed but not notarized. Without them the release is unsigned and the
      # Homebrew cask is skipped (.goreleaser.yaml skip_upload), so brew users never
      # get an unsigned build. With them, the tap token is required too.
      - name: Check release secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set_n=0; missing=""
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            eval "val=\${$v}"
            if [ -n "$val" ]; then set_n=$((set_n+1)); else missing="$missing $v"; fi
          done
          if [ "$set_n" -eq 0 ]; then
            echo "::warning::No macOS signing secrets: ${GITHUB_REF_NAME} will be released UNSIGNED and the Homebrew cask will not be updated."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets are partially set; missing:${missing}. Set all five or none (docs/release-setup.md 6.3)."
            exit 1
          fi
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::Signing secrets are set but HOMEBREW_TAP_GITHUB_TOKEN is empty (docs/release-setup.md ch.5)."
            exit 1
          fi
          echo "All release secrets are present: signed release with Homebrew cask."

      # GoReleaser refuses a dirty tree; show the state for diagnosis.
      - name: Working tree status
        run: git status --porcelain

      # Pinned exactly; bumping GoReleaser is a deliberate edit (docs/release-setup.md).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.20.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
